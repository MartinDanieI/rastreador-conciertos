name: Rastreador de conciertos

on:
  schedule:
    # Cada 30 minutos. Minutos "raros" (13 y 43): en la hora en punto GitHub se
    # retrasa o se salta ejecuciones.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar en el log (no avisar ni guardar)"
        type: boolean
        default: false

concurrency:
  group: rastreador
  cancel-in-progress: false

permissions:
  contents: write # para guardar eventos.json en el repo

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      TZ: America/Bogota

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar boleteras
        id: rastreo
        run: python rastreador.py
        continue-on-error: true # si una fuente falla igual se guarda lo de las demás

      # eventos.json solo cambia cuando hay eventos nuevos o una fuente cae/vuelve,
      # así que solo hay commit cuando pasó algo.
      - name: Guardar eventos.json
        run: |
          if git diff --quiet -- eventos.json; then
            echo "Sin cambios en eventos.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add eventos.json
            git commit -m "Eventos actualizados $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Marcar fallo si alguna fuente falló
        if: steps.rastreo.outcome == 'failure'
        run: exit 1
